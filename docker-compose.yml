services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm30-api.rule=Host(`crm3.tzmicha.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.crm30-api.entrypoints=websecure"
      - "traefik.http.routers.crm30-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm30-api.loadbalancer.server.port=8000"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    env_file:
      - ./ai-service/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_BACKEND_URL=https://crm3.tzmicha.com/api
      - NEXT_PUBLIC_AI_URL=http://ai-service:8001
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped
    networks:
      - internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm30-frontend.rule=Host(`crm3.tzmicha.com`)"
      - "traefik.http.routers.crm30-frontend.entrypoints=websecure"
      - "traefik.http.routers.crm30-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm30-frontend.loadbalancer.server.port=3001"

networks:
  internal:
    driver: bridge
  traefik-net:
    external: true

volumes:
  redis_data:
