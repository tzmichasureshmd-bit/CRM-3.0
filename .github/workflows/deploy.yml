name: Deploy CRM 3.0 to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env files from secrets
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          echo "${{ secrets.FRONTEND_ENV }}" > .env.local
          echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env.local
          echo "${{ secrets.AI_SERVICE_ENV }}" > ai-service/.env

      - name: Stop only CRM 3.0 containers
        run: docker compose down --remove-orphans || true

      - name: Build images
        run: docker compose build --no-cache
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: https://crm3.tzmicha.com
          NEXT_PUBLIC_APP_URL: https://crm3.tzmicha.com

      - name: Start containers
        run: docker compose up -d

      - name: Verify deployment
        run: |
          sleep 15
          docker compose ps
          docker compose ps | grep -E "Up|running" || (docker compose logs --tail=50 && exit 1)

      - name: Cleanup old images
        if: success()
        run: docker image prune -f
