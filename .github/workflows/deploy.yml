name: Deploy CRM 3.0 to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env files from secrets
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          echo "${{ secrets.FRONTEND_ENV }}" > .env.local
          echo "${{ secrets.AI_SERVICE_ENV }}" > ai-service/.env

      - name: Stop existing containers
        run: docker compose down --remove-orphans || true

      - name: Build images
        run: docker compose build --no-cache
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: https://crm3.tzmicha.com
          NEXT_PUBLIC_APP_URL: https://crm3.tzmicha.com

      - name: Start containers
        run: docker compose up -d

      - name: Wait for startup
        run: sleep 25

      - name: Update nginx config
        run: |
          cat > /tmp/crm3.nginx << 'NGINXEOF'
server {
    server_name crm3.tzmicha.com;

    location / {
        proxy_pass http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:8006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm3.tzmicha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm3.tzmicha.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = crm3.tzmicha.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name crm3.tzmicha.com;
    return 404;
}
NGINXEOF
          sudo cp /tmp/crm3.nginx /etc/nginx/sites-enabled/crm3
          nginx -t && sudo systemctl reload nginx

      - name: Show all logs
        run: |
          echo "=== CONTAINER STATUS ==="
          docker compose ps
          echo "=== BACKEND LOGS ==="
          docker compose logs backend --tail=50
          echo "=== AI-SERVICE LOGS ==="
          docker compose logs ai-service --tail=30
          echo "=== FRONTEND LOGS ==="
          docker compose logs frontend --tail=30

      - name: Verify all containers running
        run: |
          docker compose ps
          RUNNING=$(docker compose ps | grep -E "Up|running" | wc -l | tr -d ' ')
          echo "Running containers: $RUNNING"
          if [ "$RUNNING" -lt 4 ]; then
            echo "ERROR: Expected 4 containers running, got $RUNNING"
            docker compose logs --tail=100
            exit 1
          fi
          echo "All containers are up"

      - name: Cleanup old images
        if: success()
        run: docker image prune -f
