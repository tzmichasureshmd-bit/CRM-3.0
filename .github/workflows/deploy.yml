name: Deploy CRM 3.0 to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preserve .env files (prevent JWT session loss)
        run: |
          # NEVER overwrite .env files if they exist
          # This preserves JWT_SECRET and prevents session invalidation
          
          # Backend .env
          if [ ! -f backend/.env ]; then
            echo "⚙️  Creating NEW backend/.env from secrets..."
            cat > backend/.env << 'EOF'
          ${{ secrets.BACKEND_ENV }}
          EOF
          else
            echo "✅ backend/.env exists - PRESERVING (no changes)"
          fi
          
          # Frontend .env.local
          if [ ! -f .env.local ]; then
            echo "⚙️  Creating NEW .env.local from secrets..."
            cat > .env.local << 'EOF'
          ${{ secrets.FRONTEND_ENV }}
          EOF
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.local
          else
            echo "✅ .env.local exists - PRESERVING (no changes)"
          fi
          
          # AI Service .env
          if [ ! -f ai-service/.env ]; then
            echo "⚙️  Creating NEW ai-service/.env from secrets..."
            cat > ai-service/.env << 'EOF'
          ${{ secrets.AI_SERVICE_ENV }}
          EOF
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> ai-service/.env
          else
            echo "✅ ai-service/.env exists - PRESERVING (no changes)"
          fi
          
          # Create symlink .env -> .env.local for Docker Compose variable substitution
          echo "🔗 Creating .env symlink to .env.local for Docker Compose..."
          ln -sf .env.local .env
          
          echo ""
          echo "📝 Summary: .env files preserved to maintain JWT sessions"

      - name: Stop existing containers
        run: docker compose down --remove-orphans || true

      - name: Build images
        run: |
          # Build images one at a time to avoid memory exhaustion
          docker compose build --no-cache --memory 1g backend
          docker compose build --no-cache --memory 1g ai-service
          docker compose build --no-cache --memory 2g frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: https://crm3.tzmicha.com
          NEXT_PUBLIC_APP_URL: https://crm3.tzmicha.com
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Start containers
        run: docker compose up -d

      - name: Wait for startup
        run: sleep 25

      - name: Show all logs
        run: |
          echo "=== CONTAINER STATUS ==="
          docker compose ps
          echo "=== BACKEND LOGS ==="
          docker compose logs backend --tail=50
          echo "=== AI-SERVICE LOGS ==="
          docker compose logs ai-service --tail=30
          echo "=== FRONTEND LOGS ==="
          docker compose logs frontend --tail=30

      - name: Verify all containers running
        run: |
          docker compose ps
          RUNNING=$(docker compose ps | grep -E "Up|running" | wc -l | tr -d ' ')
          echo "Running containers: $RUNNING"
          if [ "$RUNNING" -lt 4 ]; then
            echo "ERROR: Expected 4 containers running, got $RUNNING"
            docker compose logs --tail=100
            exit 1
          fi
          echo "All containers are up"

      - name: Cleanup old images
        if: success()
        run: docker image prune -f
